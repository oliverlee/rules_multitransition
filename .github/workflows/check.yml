name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
    types: [synchronize, opened, reopened, edited]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-env-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: |
          bazel test -- //... -//test/...

  integration-test-targets:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.query.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-env-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - id: query
        run: |
          echo "tests=$(bazel query 'tests(//test/...)' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  integration-tests:
    needs: integration-test-targets
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
        test: ${{ fromJSON(needs.integration-test-targets.outputs.tests) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-env-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: |
          bazel test --test_output=streamed ${{ matrix.test }}

  buildifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-env-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: |
          bazel run //tools:buildifier

  # https://emmer.dev/blog/skippable-github-status-checks-aren-t-really-required/
  # https://github.com/marketplace/actions/alls-green
  all:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - integration-tests
      - buildifier
    steps:
      - uses: Kesin11/actions-timeline@v2
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
