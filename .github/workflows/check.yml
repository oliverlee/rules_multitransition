name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
    types: [synchronize, opened, reopened, edited]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-env-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: |
          bazel test //...

  examples:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
        bazel:
          - "" # pinned in .bazeliskrc
          - "7.x"
          - "8.x"
          - "9.x"
        include:
          - targets: "//..." # default for all legs, replaced for Bazel 7
          - bazel: "7.x"
            # Examples that use 'cortex_m' require Bazel 8
            targets: >-
              --
              //...
              -//target_platform/...
              -//target_platform_with_custom_flag/...
              -//target_compatible_with/...
            flags: >-
              --lockfile_mode=off
              --experimental_retain_test_configuration_across_testonly
          - bazel: "8.x"
            flags: "--lockfile_mode=off"
          - bazel: "9.x"
            flags: "--lockfile_mode=off"
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-env-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - working-directory: examples
        run: |
          bazel test ${{ matrix.flags }} ${{ matrix.targets }}

  buildifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-env-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: |
          bazel run //tools:buildifier

  # https://emmer.dev/blog/skippable-github-status-checks-aren-t-really-required/
  # https://github.com/marketplace/actions/alls-green
  all:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - examples
      - buildifier
    steps:
      - uses: Kesin11/actions-timeline@v2
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
