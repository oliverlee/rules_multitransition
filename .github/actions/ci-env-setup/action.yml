name: "CI environment setup"
description: |
  * install nix
  * set home bazelrc for CI runner
  * set buildbuddy api key

inputs:
  buildbuddy-api-key:
    required: true
    description: |
      BuildBuddy API key to access the remote cache.
  nix-cache:
    default: "false"
    description: |
      Restore newest Nix store, generated by 'nix-cache.yml', from GitHub
      Actions cache.

runs:
  using: "composite"
  steps:
    - uses: nixbuild/nix-quick-install-action@v32

    # One archive from GitHub Actions cache restores faster than substituting
    # each path of QEMU, a Nix package of 'cortex_m' in 'examples/', from
    # cache.nixos.org.
    - if: inputs.nix-cache == 'true'
      uses: nix-community/cache-nix-action@v6
      with:
        # matches no saved cache and falls back to newest cache
        primary-key: nix-${{ runner.os }}-restore
        restore-prefixes-first-match: nix-${{ runner.os }}-
        save: false

    - name: setup ci bazelrc
      shell: bash
      run: |
        cp .github/workflows/ci.bazelrc ~/.bazelrc
        echo 'build:remote-cache --remote_header=x-buildbuddy-api-key=${{ inputs.buildbuddy-api-key }}' >> ~/.bazelrc
